<head>

<title>__TITLE__</title>
<style>
:root{
  --bg-top:#aeb6c0; --bg-bottom:#e2e4e1; --ink:#1d2430; --muted:#566170;
  --panel:rgba(246,247,246,.86); --line:rgba(29,36,48,.14); --accent:#2d4fbf; --accent-ink:#fff; --focus:#c8962e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top:#141b26; --bg-bottom:#2b3441; --ink:#e8ecf0; --muted:#a2acb8;
    --panel:rgba(22,28,37,.84); --line:rgba(232,236,240,.14); --accent:#7d9bff; --accent-ink:#0e1420; --focus:#e6b24a;
  }
}
:root[data-theme="dark"]{
  --bg-top:#141b26; --bg-bottom:#2b3441; --ink:#e8ecf0; --muted:#a2acb8;
  --panel:rgba(22,28,37,.84); --line:rgba(232,236,240,.14); --accent:#7d9bff; --accent-ink:#0e1420; --focus:#e6b24a;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom))}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.panel{position:fixed;z-index:2;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:calc(100% - 32px);overflow:auto}
#left{left:16px;top:16px;width:270px}
#right{right:16px;top:16px;width:300px}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details{border-top:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0}
.sl{display:grid;grid-template-columns:1fr 90px 34px;align-items:center;gap:6px;font-size:12px;margin:2px 0}
.sl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl input{width:100%}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);flex:none}
.pick{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:6px;font-size:12px;margin:3px 0}
select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 6px;width:100%}
.sl.cs{grid-template-columns:1fr 104px 40px}
#recipe{width:100%;height:96px;font:11px/1.3 ui-monospace,Menlo,monospace;margin-top:6px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px}
#status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;font-size:12.5px;color:var(--muted)}
@media (max-width:760px){
  #left{left:16px;right:16px;top:auto;bottom:16px;width:auto;max-height:42%}
  #right{display:none}
}
</style>
</head>

      for (const k in loop) { const [a, b, hz] = loop[k]; out[k] = a + (b - a) * (0.5 - 0.5 * Math.cos(s * hz * 2 * Math.PI)); } }
    if (talking) {
      const t = (now - tStart) / 1000 * 7.5, i = Math.floor(t) % TALK.length, f = t % 1;
      const a = TALK[i], b = TALK[(i + 1) % TALK.length], s = f * f * (3 - 2 * f);
      for (const n of names) if (n.startsWith('viseme_')) out[n] = (n === a ? 1 - s : 0) + (n === b ? s : 0);
      out.browInnerUp = Math.max(out.browInnerUp || 0, 0.18 * Math.max(0, Math.sin((now - tStart) / 1000 * 1.7)));
    }
    if (blinking) { const t = (now / 1000) % 4.2, bl = t < 0.14 ? Math.sin(t / 0.14 * Math.PI) : 0;
      out.eyeBlinkLeft = Math.max(out.eyeBlinkLeft || 0, bl); out.eyeBlinkRight = Math.max(out.eyeBlinkRight || 0, bl); }
    for (const n in out) applyMorph(n, out[n]);
  }
}
// test hook (scripts/viewer_check.py): plays every expression button like a user would, with the idle blink ON,
// and records the influences the meshes actually receive every 50 ms over 6 s (> one blink period)
function runTest() {
  blinking = true;
  const res = {meshes: {}, presets: {}};
  for (const m of morphMeshes) res.meshes[m.name] = Object.keys(m.morphTargetDictionary);
  for (const n of Object.keys(EXPR)) {
    for (const b of document.querySelectorAll('#exprs button')) if (b.textContent === n) b.click();
    const rec = {};
    let t = tPrev;
    for (let i = 0; i < 420; i++) {
      t += 1000 / 60; update(t);
      if (i < 60 || i % 3) continue;                        // 1 s to settle, then sample
      for (const m of morphMeshes) for (const k in m.morphTargetDictionary) {
        const v = m.morphTargetInfluences[m.morphTargetDictionary[k]], key = m.name + '|' + k;
        const r = rec[key] || (rec[key] = [Infinity, -Infinity]);
        r[0] = Math.min(r[0], v); r[1] = Math.max(r[1], v);
      }
    }
    tPrev = t;
    const out = {};
    for (const key in rec) if (rec[key][1] > 1e-3) out[key] = rec[key].map(x => Math.round(x * 1000) / 1000);
    res.presets[n] = out;
  }
  const pre = document.createElement('pre'); pre.id = '__test__'; pre.textContent = JSON.stringify(res);
  document.body.appendChild(pre);
}
function tick(now) { requestAnimationFrame(tick); update(now); controls.update(); renderer.render(scene, camera); }
requestAnimationFrame(tick);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
